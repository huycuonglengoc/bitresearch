name: CI

on:
  push:
  pull_request:

jobs:
  # CPU-only tests (validates core logic end-to-end).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release

  # CUDA build (catches compile errors in the kernel wrapper + Rust glue).
  # The kernel itself is JIT-compiled by NVRTC at runtime, so runtime validation
  # happens on-device via `--selftest`.
  build-cuda:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y curl git build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --features cuda
